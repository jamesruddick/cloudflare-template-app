name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default: nothing here writes to the repository. Anything that needs more asks for it
# on the job itself.
permissions:
  contents: read

# Actions are pinned to a commit SHA rather than a tag, because a tag is mutable - whoever controls the
# action's repository can repoint v7 at new code, and it would run here against our checkout. The trailing
# comment is the human-readable version; update both together.
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Read from .node-version rather than restated here, so the engine floor lives in one place.
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Worker types
        run: pnpm types

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm build

      - run: pnpm test

      - name: Validate deploy config
        run: pnpm run deploy:worker --dry-run

  # Kept out of `check` deliberately: a new advisory and a broken test are different problems, and neither
  # should be able to hide behind the other in one red job.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # This is the whole advisory gate. `dependency-review-action` used to sit beside it, scoped to the
      # dependencies a PR ADDS - but its API needs GitHub Advanced Security on a private repository, so on
      # one it fails in seconds on every PR without ever reading a dependency. It checks the same advisory
      # database at the same threshold against a strict subset of this lockfile, so nothing is lost by
      # leaving it out. Worth adding back only if the repository is public.
      - name: Audit dependencies
        run: pnpm audit --audit-level moderate
